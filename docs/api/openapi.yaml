openapi: 3.1.0
info:
  title: MCP Server LLM CLI Runner API
  description: |
    Model Context Protocol server providing access to multi-provider Large Language Model providers.

    ## Overview
    This API provides MCP-compliant access to multiple LLM providers:
    - **agy** (Antigravity CLI, default). **Gemini** is a deprecated alias served by agy
    - **LLaMA**: Local inference with llama-cpp-python

    Codex is not a provider here; use the `codex` MCP server (`codex mcp-server`) directly.

    ## MCP Protocol
    This server implements the Model Context Protocol (MCP) JSON-RPC 2.0 interface.
    All requests use JSON-RPC 2.0 format with method routing.

    ## Authentication
    No API keys are required. agy needs an installed, authenticated `agy` CLI
    (`GEMINI_API_KEY` has no effect); LLaMA runs locally without authentication.

  version: 0.1.0
  contact:
    name: API Support
  license:
    name: MIT

servers:
  - url: stdio://localhost
    description: Local MCP server (stdio transport)
  - url: http://localhost:8080
    description: HTTP transport (when enabled)

tags:
  - name: MCP Protocol
    description: Core MCP protocol operations
  - name: Tools
    description: LLM tool operations
  - name: Resources
    description: Resource management operations
  - name: Providers
    description: Provider-specific operations

paths:
  /rpc:
    post:
      summary: JSON-RPC 2.0 Endpoint
      description: |
        Main JSON-RPC 2.0 endpoint for all MCP operations.
        All methods are invoked through this endpoint with the appropriate method name.
      tags:
        - MCP Protocol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
            examples:
              initialize:
                summary: Initialize MCP session
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: initialize
                  params:
                    protocolVersion: "2024-11-05"
                    capabilities: {}
                    clientInfo:
                      name: example-client
                      version: "1.0.0"
              list_tools:
                summary: List available tools
                value:
                  jsonrpc: "2.0"
                  id: 2
                  method: tools/list
                  params: {}
              call_tool:
                summary: Call a tool
                value:
                  jsonrpc: "2.0"
                  id: 3
                  method: tools/call
                  params:
                    name: llm_complete
                    arguments:
                      prompt: "Write a haiku about coding"
                      provider: agy
      responses:
        '200':
          description: JSON-RPC 2.0 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'

components:
  schemas:
    JsonRpcRequest:
      type: object
      required:
        - jsonrpc
        - method
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
          description: JSON-RPC version (must be "2.0")
        id:
          oneOf:
            - type: string
            - type: integer
          description: Request identifier (omit for notifications)
        method:
          type: string
          description: Method name to invoke
          enum:
            - initialize
            - tools/list
            - tools/call
            - resources/list
            - resources/read
        params:
          type: object
          description: Method parameters

    JsonRpcResponse:
      type: object
      required:
        - jsonrpc
        - id
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: string
            - type: integer
            - type: "null"
        result:
          description: Success result (mutually exclusive with error)
        error:
          $ref: '#/components/schemas/JsonRpcError'

    JsonRpcError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: |
            Error codes:
            - -32700: Parse error
            - -32600: Invalid Request
            - -32601: Method not found
            - -32602: Invalid params
            - -32603: Internal error
        message:
          type: string
        data:
          description: Additional error data

    InitializeParams:
      type: object
      required:
        - protocolVersion
        - capabilities
        - clientInfo
      properties:
        protocolVersion:
          type: string
          description: MCP protocol version
          example: "2024-11-05"
        capabilities:
          type: object
          description: Client capabilities
        clientInfo:
          type: object
          properties:
            name:
              type: string
            version:
              type: string

    InitializeResult:
      type: object
      properties:
        protocolVersion:
          type: string
        capabilities:
          type: object
          properties:
            tools:
              type: object
            resources:
              type: object
            logging:
              type: object
        serverInfo:
          type: object
          properties:
            name:
              type: string
            version:
              type: string

    Tool:
      type: object
      required:
        - name
        - inputSchema
      properties:
        name:
          type: string
          description: Tool identifier
        description:
          type: string
          description: Human-readable description
        inputSchema:
          type: object
          description: JSON Schema for tool parameters

    ToolsListResult:
      type: object
      properties:
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'

    ToolCallParams:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Tool name to invoke
        arguments:
          type: object
          description: Tool arguments

    ToolCallResult:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ContentBlock'
        isError:
          type: boolean
          default: false

    ContentBlock:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [text, image, resource]
        text:
          type: string
          description: Text content (for type=text)
        data:
          type: string
          description: Base64-encoded data (for type=image)
        mimeType:
          type: string
          description: MIME type (for type=image)

    # Tool schemas (see lean_mcp_interface.py)
    LlmCompleteParams:
      type: object
      required:
        - prompt
      properties:
        prompt:
          type: string
          description: The prompt to send to the LLM
        provider:
          type: string
          description: "Provider to use. 'gemini' is a deprecated alias for agy. If omitted, the configured default is used and auto-routing applies if it is unavailable."
          enum: [agy, gemini, llama]
        model:
          type: string
          description: Optional model name (provider-specific)
        temperature:
          type: number
          description: Sampling temperature (0.0-2.0)
          default: 0.7
          minimum: 0.0
          maximum: 2.0
        max_tokens:
          type: integer
          description: Maximum tokens to generate
        stream:
          type: boolean
          description: Enable streaming response
          default: false

    ProviderInfoParams:
      type: object
      required:
        - provider
      properties:
        provider:
          type: string
          description: Provider name
          enum: [agy, gemini, llama]

x-mcp-tools:
  llm_complete:
    description: Execute LLM completion with provider selection and streaming support
    inputSchema:
      $ref: '#/components/schemas/LlmCompleteParams'
    examples:
      - name: Simple prompt via agy
        arguments:
          prompt: "What is the capital of France?"
          provider: agy
      - name: Local LLaMA
        arguments:
          prompt: "Explain quantum computing"
          provider: llama
          temperature: 0.3
          max_tokens: 500

  list_providers:
    description: List available LLM providers and their status
    inputSchema:
      type: object
      properties: {}

  provider_info:
    description: Get detailed information about a specific provider
    inputSchema:
      $ref: '#/components/schemas/ProviderInfoParams'
    examples:
      - name: agy info
        arguments:
          provider: agy
