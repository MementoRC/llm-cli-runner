---
# Pre-commit hooks configuration for MCP Server LLM CLI Runner
# Follows enterprise security standards and comprehensive quality validation

repos:
  # Security and vulnerability scanning
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: ["-c", ".bandit", "-r", "src/"]
        pass_filenames: false

  # pip-audit check for known vulnerabilities
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit
        entry: pixi run -e audit audit
        language: system
        pass_filenames: false
        require_serial: true
        files: ^(pyproject\.toml|pixi\.lock)$

  # Code formatting and style with Ruff, run from the pixi quality env so
  # there is one ruff binary shared with CI (no separate rev pin to keep in sync)
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint (pixi quality env)
        entry: pixi run -e quality ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format (pixi quality env)
        entry: pixi run -e quality ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

  # Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # Type checking with pyright (pixi-based)
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: pixi run -e quality pyright src/
        language: system
        pass_filenames: false
        require_serial: true

  # YAML validation
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ["-d", "relaxed"]

  # GitHub Actions workflow linting
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        files: '^\.github/workflows/.*\.ya?ml$'

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-json
      - id: detect-private-key
      - id: forbid-new-submodules

  # Documentation checks
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: ["--convention=google", "--add-ignore=D202"]

  # Local hooks - pytest with targeted ignores for known issues
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pixi run -e quality pytest tests/unit/ -x --tb=short
        language: system
        pass_filenames: false
        require_serial: true
