[project]
name = "mcp-server-llm-cli-runner"
version = "0.1.0"
description = "A Model Context Protocol server providing multi-provider LLM access via CLI tools (Antigravity agy, LLaMA)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Anthropic, PBC." }]
maintainers = [{ name = "Claude Code Team", email = "noreply@anthropic.com" }]
keywords = ["mcp", "llm", "agy", "antigravity", "gemini", "llama", "ai", "multi-provider"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
mcp-server-llm-cli-runner = "mcp_server_llm_cli_runner:main"

[project.urls]
Homepage = "https://github.com/MementoRC/llm-cli-runner"
Repository = "https://github.com/MementoRC/llm-cli-runner"
Issues = "https://github.com/MementoRC/llm-cli-runner/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
addopts = "-v --tb=short --timeout=30"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "e2e: marks tests as end-to-end tests",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "property: marks tests as property-based tests",
    "performance: marks tests as performance tests",
    "requires_llama: tests that require LLaMA models",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["F", "E9", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F821", "F401", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]  # Local development on linux-64, CI validates cross-platform

[tool.pixi.dependencies]
# Core runtime dependencies
python = ">=3.12"
pip = ">=26.2"
aiohttp = ">=3.13.4"
click = ">=8.1.7"
cryptography = ">=50.0.0"
httpx = ">=0.24.0"
llama-cpp-python = ">=0.2.0"
fastmcp = ">=3.2.4"
psutil = ">=5.9.0"
pydantic = ">=2.0.0"
python-dotenv = ">=1.2.2"
structlog = ">=24.0.0"
tomli = ">=2.0.1"

# ===== TIERED QUALITY FEATURES =====
# TIER 1: Essential Quality Gates (ZERO-TOLERANCE)
[tool.pixi.feature.quality.dependencies]
# Core Testing Framework
pytest = ">=8.0.0"
pytest-cov = ">=4.0.0"
pytest-timeout = ">=2.1.0"
pytest-asyncio = ">=0.21.0"
pytest-xdist = ">=3.3.0"

# Linting & Formatting
ruff = ">=0.7.3"

# Type Checking
pyright = ">=1.1.402"

# Test dependencies
tomli-w = ">=1.0.0"  # For writing TOML files in integration tests
toml = ">=0.10.2"  # For test fixtures

# TIER 2: Extended Quality & Security
[tool.pixi.feature.quality-extended.dependencies]
# Security Scanning
bandit = ">=1.7.0"

# Code Quality Analysis
hypothesis = ">=6.0.0"
vulture = ">=2.11"  # Dead code detection

# Git Hooks
pre-commit = ">=3.0.0"

# Dedicated dependency audit env. pip-audit cannot run on Python 3.15: its pip_api
# dependency vendors a pyparsing that imports `sre_constants`, removed in 3.15.
# So pip-audit runs on an older Python and scans the default env's site-packages
# via --path. Move back to the default Python once pip-audit supports 3.15.
[tool.pixi.feature.audit.dependencies]
python = ">=3.13,<3.15"
pip-audit = ">=2.6.0"
filelock = "*"  # needed by cachecontrol's FileCache; not pulled in by the conda pip-audit package

[tool.pixi.feature.audit.tasks]
# Depends on the default env being installed (the dependency task installs it first).
# diskcache (transitive via fastmcp) has no upstream fix; ignore until a release exists.
audit = { cmd = "pip-audit --skip-editable --path .pixi/envs/default/lib/python3.*/site-packages --ignore-vuln CVE-2025-69872", depends-on = [{ task = "dev-setup", environment = "default" }] }

# TIER 3: CI/CD & Build
[tool.pixi.feature.quality-ci.dependencies]
# Security Audit Tools
pip-audit = ">=2.6.0"

# CI Reporting
coverage = ">=7.0.0"

# Build tools
python-build = ">=1.0.0"

# CI minimal feature for GitHub Actions compatibility
[tool.pixi.feature.ci-minimal.dependencies]
# Minimal testing (with required pytest plugins)
pytest = "*"
pytest-cov = "*"
pytest-timeout = "*"
pytest-asyncio = "*"

# Minimal linting
ruff = "*"

# Minimal type checking
pyright = "*"

# Test dependencies
tomli-w = "*"
toml = "*"

[tool.pixi.feature.dev-specialized.dependencies]
# Development tools not needed for CI
memory_profiler = "*"
pytest-benchmark = "*"

[tool.pixi.environments]
# Basic runtime environment
default = {solve-group = "default"}

# Quality gate environments (tiered approach) - inherit from default
quality = {features = ["quality"], solve-group = "default"}
quality-extended = {features = ["quality", "quality-extended"], solve-group = "default"}
quality-full = {features = ["quality", "quality-extended", "quality-ci"], solve-group = "default"}

# Development environment (full quality + specialized tools)
dev = {features = ["quality", "quality-extended", "quality-ci", "dev-specialized"], solve-group = "default"}

# CI environment (quality + CI reporting)
ci = {features = ["quality", "quality-ci"], solve-group = "default"}

# CI environment alias for ci-framework compatibility
quality-ci = {features = ["quality", "quality-ci"], solve-group = "default"}

# Minimal CI environment (for GitHub Actions compatibility)
ci-minimal = {features = ["ci-minimal"], solve-group = "default"}

# Dependency audit environment (older Python; scans the default env)
audit = {features = ["audit"], no-default-feature = true}

[tool.pixi.tasks]
# ===== TIER 1: CORE DEVELOPMENT TASKS (ESSENTIAL) =====
# Installation & Setup
install-editable = "python -m pip install -e . --no-deps"
install-editable-fallback = "python setup.py develop --no-deps || python -c 'import sys; sys.path.insert(0, \"src\")'"
dev-setup = "echo 'Development environment ready'"

# Testing (ZERO-TOLERANCE QUALITY GATES)
# All tests enabled - TDD complete
test = "pytest tests/ -v"
test-cov = "pytest tests/ --cov=src/mcp_server_llm_cli_runner --cov-report=term-missing --cov-report=xml"
test-unit = "pytest tests/unit/ -v"
test-integration = "pytest tests/integration/ -v"
test-e2e = "pytest tests/test_llm_compliant_server_e2e.py -v"
test-property = "pytest tests/ -m property -v"

# Quality Gates (CRITICAL - MUST PASS)
lint = "ruff check src/ tests/ --select=F,E9"
lint-fix = "ruff check --fix src/ tests/"
format = "ruff format src/ tests/"
format-check = "ruff format --check src/ tests/"
format-diff = "ruff format --diff src/ tests/"
typecheck = "pyright src/"

# Combined Quality Check
quality = { depends-on = ["test", "lint", "typecheck"] }

# ===== TIER 2: SECURITY & COMPLIANCE TASKS =====
# Security Scanning
security-scan = "bandit -r src/ --severity-level high"

# Dead Code Detection
dead-code = "vulture src/ --min-confidence 80"
dead-code-all = "vulture src/ tests/ --min-confidence 60"

# Static Analysis Suite
static-analysis = { depends-on = ["security-scan", "dead-code"] }

# Comprehensive Check
check-all = { depends-on = ["quality", "static-analysis"] }

# ===== TIER 3: CI/CD & DEPLOYMENT TASKS =====
# CI-specific variants
ci-test = { cmd = "pytest tests/ --cov=src/mcp_server_llm_cli_runner --cov-report=xml --timeout=90", env = { ENVIRONMENT = "ci" } }
ci-lint = "ruff check src/ tests/ --output-format=github"
ci-format-check = "ruff format --check src/ tests/"

# Build & Deploy
build = "python -m build"
clean = "rm -rf __pycache__ .pytest_cache .coverage htmlcov .ruff_cache dist build"

# Pre-commit Integration
pre-commit = "pre-commit run --all-files"
install-pre-commit = "pre-commit install --install-hooks"

# ===== PROJECT-SPECIFIC TASKS =====
# MCP server execution
serve = "python -m mcp_server_llm_cli_runner"
serve-debug = { cmd = "python -m mcp_server_llm_cli_runner --debug", env = { LOG_LEVEL = "DEBUG" } }

# ===== LEGACY/SPECIALIZED TASKS =====
# Keep existing specialized tasks
benchmark = "pytest tests/ -m benchmark --benchmark-only --benchmark-sort=mean"
test-coverage = "pytest tests/ --cov=src/mcp_server_llm_cli_runner --cov-branch --cov-report=html --cov-report=xml --cov-report=json --cov-report=term-missing"
