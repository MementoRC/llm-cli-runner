name: Platform Validation

on:
  # Trigger on pyproject.toml changes (when dependencies are modified)
  push:
    paths:
      - 'pyproject.toml'
      - 'pixi.lock'
      - '.github/workflows/platform-validation.yml'
    branches: [ main, development ]
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'pixi.lock'
      - '.github/workflows/platform-validation.yml'
    branches: [ main, development ]

  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      test_platform:
        description: 'Specific platform to test (optional)'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'linux-64'
          - 'osx-64'
          - 'osx-arm64'
          - 'win-64'

# Required permissions for posting PR comments
permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  # pixi.lock is v7 (written by pixi 0.82.0); v7 needs pixi >= 0.68.
  PIXI_VERSION: v0.82.0

jobs:
  # Memory-efficient platform validation
  validate-platforms:
    name: Validate ${{ matrix.platform }} (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false  # Continue testing other platforms if one fails
      matrix:
        # linux-64: real install per environment (host can run it).
        # other platforms: one solve-only leg each (`pixi lock` solves all
        # environments at once and needs no runnable host).
        include:
          - {platform: linux-64, environment: quality, mode: install}
          - {platform: linux-64, environment: quality-extended, mode: install}
          - {platform: linux-64, environment: ci, mode: install}
          - {platform: osx-64, environment: all, mode: solve}
          - {platform: osx-arm64, environment: all, mode: solve}
          - {platform: win-64, environment: all, mode: solve}

    env:
      MATRIX_PLATFORM: ${{ matrix.platform }}
      MATRIX_ENVIRONMENT: ${{ matrix.environment }}
      REPORT_FILE: platform-report-${{ matrix.platform }}-${{ matrix.environment }}.md

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

    - name: Setup pixi
      uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e  # v0.11.3
      with:
        pixi-version: ${{ env.PIXI_VERSION }}
        cache: false  # Disable cache to save memory
        manifest-path: pyproject.toml

    - name: Set memory limits
      run: |
        echo "🔧 Setting memory optimization..."
        echo "PIXI_CACHE_DIR=/tmp/pixi-cache" >> $GITHUB_ENV
        echo "CONDA_PKGS_DIRS=/tmp/conda-pkgs" >> $GITHUB_ENV
        echo "PIXI_SOLVER_THREADS=2" >> $GITHUB_ENV

        # Free up disk space
        sudo rm -rf /opt/hostedtoolcache
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet

        echo "💾 Available memory:"
        free -h

    - name: Rewrite platforms in pyproject.toml (solve-only legs)
      if: matrix.mode == 'solve'
      run: |
        echo "🎯 Testing platform: $MATRIX_PLATFORM"

        cp pyproject.toml pyproject.toml.backup

        # Replace the platforms list (handles a trailing comment)
        sed -i "s/platforms = \[.*\].*\$/platforms = [\"$MATRIX_PLATFORM\"]/" pyproject.toml

        echo "📋 Platform configuration:"
        grep -A5 -B5 "platforms.*=" pyproject.toml

    - name: Solve dependencies for non-linux platform (no install)
      if: matrix.mode == 'solve'
      timeout-minutes: 30
      run: |
        echo "🔍 Solving all environments for $MATRIX_PLATFORM (solve-only)..."

        # `pixi lock` solves without installing, so the linux host is fine.
        if pixi lock; then
          echo "✅ Dependency resolution successful for $MATRIX_PLATFORM"
        else
          echo "##[error]Dependency solve failed for platform $MATRIX_PLATFORM"
          exit 1
        fi

    - name: Install and check environment (linux-64)
      if: matrix.mode == 'install'
      timeout-minutes: 30
      run: |
        echo "🔍 Installing environment $MATRIX_ENVIRONMENT on $MATRIX_PLATFORM..."

        if pixi install -e "$MATRIX_ENVIRONMENT"; then
          echo "✅ Dependency resolution successful for $MATRIX_PLATFORM"

          # Test quality commands (dry run)
          echo "🧪 Testing quality commands..."
          pixi run -e "$MATRIX_ENVIRONMENT" --dry-run lint || echo "⚠️ lint command not available"
          pixi run -e "$MATRIX_ENVIRONMENT" --dry-run test || echo "⚠️ test command not available"
          pixi run -e "$MATRIX_ENVIRONMENT" --dry-run typecheck || echo "⚠️ typecheck command not available"
        else
          echo "##[error]Platform $MATRIX_PLATFORM is not compatible with environment $MATRIX_ENVIRONMENT"
          exit 1
        fi

    - name: Test package availability
      run: |
        echo "📦 Testing critical package availability for $MATRIX_PLATFORM..."

        # Test if critical packages are available on this platform
        CRITICAL_PACKAGES=("pytest" "ruff" "pyright" "bandit" "pip-audit")

        for package in "${CRITICAL_PACKAGES[@]}"; do
          if pixi search "$package" --platform "$MATRIX_PLATFORM" | grep -q "$package"; then
            echo "✅ $package available on $MATRIX_PLATFORM"
          else
            echo "⚠️ $package might not be available on $MATRIX_PLATFORM"
          fi
        done

    - name: Generate platform compatibility report
      if: always()
      env:
        JOB_STATUS: ${{ job.status }}
      run: |
        {
          echo "📊 Platform Compatibility Report"
          echo "================================="
          echo ""
          echo "**Platform**: $MATRIX_PLATFORM"
          echo "**Environment**: $MATRIX_ENVIRONMENT"
          echo "**Status**: $JOB_STATUS"
          echo "**Date**: $(date)"
          echo ""
          echo "### Dependencies"
        } > "$REPORT_FILE"

        # pixi 0.82: `pixi info` takes no -e; read per-environment data from JSON
        pixi info --json \
          | jq -r '.environments_info[] | "- \(.name): \(.dependencies | length) dependencies"' \
          >> "$REPORT_FILE" || echo "N/A" >> "$REPORT_FILE"

    - name: Upload platform report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: platform-report-${{ matrix.platform }}-${{ matrix.environment }}
        path: platform-report-${{ matrix.platform }}-${{ matrix.environment }}.md

    - name: Restore original pyproject.toml
      if: always() && matrix.mode == 'solve'
      run: |
        mv pyproject.toml.backup pyproject.toml

  # Cross-platform compatibility summary
  compatibility-summary:
    name: Platform Compatibility Summary
    runs-on: ubuntu-latest
    needs: [validate-platforms]
    if: always()

    steps:
    - name: Download all platform reports
      uses: actions/download-artifact@v4
      with:
        pattern: platform-report-*
        merge-multiple: true

    - name: Generate compatibility matrix
      run: |
        echo "# 🌍 Cross-Platform Compatibility Matrix" > compatibility-summary.md
        echo "" >> compatibility-summary.md
        echo "Generated on: $(date)" >> compatibility-summary.md
        echo "" >> compatibility-summary.md

        # Create matrix table
        echo "| Platform | quality | quality-extended | ci |" >> compatibility-summary.md
        echo "|----------|---------|------------------|-------|" >> compatibility-summary.md

        for platform in linux-64 osx-64 osx-arm64 win-64; do
          echo -n "| $platform |" >> compatibility-summary.md

          for env in quality quality-extended ci; do
            # Non-linux platforms are solved once for all environments
            if [ "$platform" = "linux-64" ]; then
              report="platform-report-$platform-$env.md"
            else
              report="platform-report-$platform-all.md"
            fi
            if [ -f "$report" ]; then
              if grep -q "Status.*success" "$report"; then
                echo -n " ✅ |" >> compatibility-summary.md
              else
                echo -n " ❌ |" >> compatibility-summary.md
              fi
            else
              echo -n " ❓ |" >> compatibility-summary.md
            fi
          done
          echo "" >> compatibility-summary.md
        done

        echo "" >> compatibility-summary.md
        echo "## 📋 Recommendations" >> compatibility-summary.md
        echo "" >> compatibility-summary.md
        echo "- ✅ **Supported**: Platform can be safely added to pyproject.toml" >> compatibility-summary.md
        echo "- ❌ **Unsupported**: Platform has dependency resolution issues" >> compatibility-summary.md
        echo "- ❓ **Unknown**: Platform validation did not complete" >> compatibility-summary.md
        echo "" >> compatibility-summary.md
        echo "### Next Steps" >> compatibility-summary.md
        echo "1. Add supported platforms to \`pyproject.toml\` incrementally" >> compatibility-summary.md
        echo "2. Test locally with \`pixi install --platform <platform>\`" >> compatibility-summary.md
        echo "3. Monitor CI stability after each platform addition" >> compatibility-summary.md

    - name: Upload compatibility summary
      uses: actions/upload-artifact@v4
      with:
        name: compatibility-summary
        path: compatibility-summary.md

    - name: Comment on PR (if PR)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('compatibility-summary.md', 'utf8');

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });

  # Suggest platform additions
  suggest-platform-updates:
    name: Suggest Platform Updates
    runs-on: ubuntu-latest
    needs: [validate-platforms]
    if: always() && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

    - name: Download compatibility summary
      uses: actions/download-artifact@v4
      with:
        name: compatibility-summary
        path: .

    - name: Generate platform update suggestions
      run: |
        echo "🎯 Platform Update Suggestions" > suggestions.md
        echo "" >> suggestions.md

        # Check current platforms in pyproject.toml
        CURRENT_PLATFORMS=$(grep -o 'platforms = \[.*\]' pyproject.toml | sed 's/platforms = \[\(.*\)\]/\1/' | tr -d '"')
        echo "**Current platforms**: $CURRENT_PLATFORMS" >> suggestions.md
        echo "" >> suggestions.md

        # Suggest additions based on success
        echo "### ✅ Safe to Add" >> suggestions.md
        echo "Based on successful validation, these platforms can be added:" >> suggestions.md
        echo "" >> suggestions.md

        # This would be enhanced with actual validation results
        echo "```toml" >> suggestions.md
        echo "# Current configuration (optimal for local development):" >> suggestions.md
        echo 'platforms = ["linux-64"]  # Local development only' >> suggestions.md
        echo "```" >> suggestions.md
        echo "✅ Cross-platform validation uses --platform flag in CI." >> suggestions.md
        echo "🏠 Local development optimized for linux-64 only." >> suggestions.md
        echo "🚀 Reduced pixi complexity and faster local setup." >> suggestions.md
        echo "" >> suggestions.md
        echo "### ⚠️ Gradual Addition Recommended" >> suggestions.md
        echo "Add platforms one at a time to monitor CI stability:" >> suggestions.md
        echo "" >> suggestions.md
        echo "1. Add \`osx-64\` first (most compatible)" >> suggestions.md
        echo "2. Add \`osx-arm64\` second (Apple Silicon)" >> suggestions.md
        echo "3. Add \`win-64\` last (highest complexity)" >> suggestions.md

    - name: Upload suggestions
      uses: actions/upload-artifact@v4
      with:
        name: platform-suggestions
        path: suggestions.md

    - name: Add to step summary
      run: |
        echo "## 🌍 Platform Validation Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        cat compatibility-summary.md >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        cat suggestions.md >> $GITHUB_STEP_SUMMARY
